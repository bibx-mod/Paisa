 if(as=="u")b=`<input placeholder="Search id / name" value="${esc(uq)}" oninput="uq=this.value" onchange="render(1)"><small>Users: ${US.length} · Coins: ${US.reduce((a,[,u])=>a+(u.coins||0),0)}</small>`+US.filter(([id,u])=>!uq||id.includes(uq)||(u.name||"").toLowerCase().includes(uq.toLowerCase())).sort((a,b)=>(b[1].coins||0)-(a[1].coins||0)).slice(0,30).map(([id,u])=>`<div class="c"><b>${esc(u.name)}</b> @${esc(u.uname||"-")} · ${id}<br>${u.coins||0} coins · cash NPR ${(+u.cash||0).toFixed(2)}<div class="r"><input id="u${id}" type="number" placeholder="coins"><button class="b" onclick="ac2('${id}',1)">+</button><button class="b x" onclick="ac2('${id}',-1)">−</button></div><button class="b g" style="margin-top:6px;min-height:40px" onclick="if(confirm('Delete this user?'))db.ref('users/${id}').remove()">🗑 Delete user</button></div>`).join("");
 if(as=="t")b=`<div class="c"><input id="tt" placeholder="Task title"><input id="tl" placeholder="Link https://t.me/... or TikTok / WhatsApp / YouTube"><input id="tc2" placeholder="@channelusername (Telegram only). EMPTY for other links"><input id="tr" type="number" placeholder="Reward coins"><button class="b w" onclick="at()">Add task</button></div>`+Object.entries(cfg.tasks||{}).map(([id,t])=>`<div class="c r"><div>${esc(t.t)}<small>${esc(t.chat)} · +${t.r}</small></div><button class="b x" onclick="db.ref('config/tasks/${id}').remove()">Delete</button></div>`).join("");

 ok();toast(s)}
